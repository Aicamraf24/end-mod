name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: microsoft

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Buscar el proyecto
        id: proyecto
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "No se encontró settings.gradle en el repositorio. Archivos presentes:"
            find . -not -path './.git/*' -type f | head -n 50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Compilar
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle build

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: endrealms
          path: ${{ steps.proyecto.outputs.dir }}/build/libs/

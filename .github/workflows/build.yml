name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: microsoft

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Descomprimir el proyecto
        run: |
          if [ -f endrealms.zip ]; then
            unzip -q -o endrealms.zip -d proyecto
          else
            mkdir proyecto
            cp -r . proyecto/ 2>/dev/null || true
          fi

      - name: Buscar el proyecto
        id: proyecto
        run: |
          f=$(find proyecto -name settings.gradle | head -n 1)
          if [ -z "$f" ]; then
            echo "No se encontró settings.gradle. Archivos presentes:"
            find proyecto -type f -not -path 'proyecto/.git/*' | head -n 50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Compilar
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: gradle build

      - name: Probar servidor y mostrar el error real
        continue-on-error: true
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\n" > run/server.properties
          (sleep 200; echo stop) | timeout 420 gradle runServer > server.log 2>&1 || true
          echo "===== ERRORES ====="
          grep -n -i -E "ERROR|Exception|Caused by|Failed|Unknown|Couldn't" server.log | head -100 || true
          echo "===== FINAL DEL LOG ====="
          tail -80 server.log

      - name: Subir el jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endrealms
          path: ${{ steps.proyecto.outputs.dir }}/build/libs/
